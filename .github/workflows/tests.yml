name: Tests
on:
  push:
    branches: [main, develop, feature/electrode-wear-auto-correction]
  pull_request:
    branches: [main, develop]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate startup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $files = @(
            (Join-Path $PWD "Start_HegesztesSzimulacio.ps1"),
            (Join-Path $PWD "tools/Run-Bodyline-Service.ps1"),
            (Join-Path $PWD "tools/Stop-Bodyline.ps1"),
            (Join-Path $PWD "tools/Record-Bodyline-Demo.ps1")
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse error in $file"
              $errors | Format-List
              exit 1
            }
          }
          Write-Host "PowerShell startup and service scripts syntax OK."
      - name: Package tracked repository files
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          Compress-Archive -Path $tracked -DestinationPath BODYLINE_source.zip -CompressionLevel Optimal -Force
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BODYLINE-source
          path: BODYLINE_source.zip
          if-no-files-found: error

  mqtt-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Start Mosquitto
        run: docker compose up -d mqtt
      - name: Start monitor and wait for MQTT subscription
        shell: bash
        run: |
          mkdir -p logs
          nohup python -u -m src.monitor > logs/ci-monitor.log 2>&1 &
          echo $! > /tmp/bodyline-monitor.pid
          for i in $(seq 1 60); do
            if grep -q "MQTT monitor connected" logs/ci-monitor.log; then
              echo "Monitor subscribed to MQTT."
              exit 0
            fi
            sleep 0.5
          done
          cat logs/ci-monitor.log
          exit 1
      - name: Run real MQTT-to-SQLite integration tests
        env:
          RUN_MQTT_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p "test_mqtt_integration.py" -v
      - name: Stop monitor and Mosquitto
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/bodyline-monitor.pid ]; then
            kill "$(cat /tmp/bodyline-monitor.pid)" 2>/dev/null || true
          fi
          docker compose down
