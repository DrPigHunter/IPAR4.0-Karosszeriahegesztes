name: Generate Excel catalog
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/export_catalog.yml'
      - 'config/welding_catalog.xml'
permissions:
  contents: write
jobs:
  export-xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel writer
        run: python -m pip install openpyxl
      - name: Convert Excel-compatible source workbook to XLSX
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.worksheet.table import Table, TableStyleInfo

          source = Path("config/welding_catalog.xml")
          target = Path("config/welding_catalog.xlsx")
          ns_uri = "urn:schemas-microsoft-com:office:spreadsheet"
          ns = {"ss": ns_uri}
          root = ET.parse(source).getroot()

          def get_sheet_rows(worksheet):
              result = []
              table = worksheet.find("ss:Table", ns)
              if table is None:
                  return result
              for row in table.findall("ss:Row", ns):
                  values = []
                  next_col = 1
                  for cell in row.findall("ss:Cell", ns):
                      idx = cell.attrib.get(f"{{{ns_uri}}}Index")
                      if idx is not None:
                          target_col = int(idx)
                          while next_col < target_col:
                              values.append(None)
                              next_col += 1
                      data = cell.find("ss:Data", ns)
                      value = data.text if data is not None else None
                      kind = data.attrib.get(f"{{{ns_uri}}}Type", "String") if data is not None else "String"
                      if value is not None and kind == "Number":
                          number = float(value)
                          value = int(number) if number.is_integer() else number
                      values.append(value)
                      next_col += 1
                  result.append(values)
              return result

          wb = Workbook()
          wb.remove(wb.active)
          found = set()
          for worksheet in root.findall("ss:Worksheet", ns):
              name = worksheet.attrib.get(f"{{{ns_uri}}}Name", "")
              if name not in {"Modellek", "Hegesztési pontok"}:
                  continue
              sheet = wb.create_sheet(name)
              rows = get_sheet_rows(worksheet)
              for values in rows:
                  sheet.append(values)
              found.add(name)
              sheet.freeze_panes = "A2"
              sheet.auto_filter.ref = sheet.dimensions
              sheet.row_dimensions[1].height = 34
              for cell in sheet[1]:
                  cell.fill = PatternFill("solid", fgColor="123B5D")
                  cell.font = Font(bold=True, color="FFFFFF")
                  cell.alignment = Alignment(horizontal="center", vertical="center", wrap_text=True)
              for column_cells in sheet.columns:
                  letter = column_cells[0].column_letter
                  longest = max(len(str(c.value or "")) for c in column_cells)
                  sheet.column_dimensions[letter].width = min(max(longest + 2, 12), 32)
              if sheet.max_row > 1 and sheet.max_column > 0:
                  table_ref = sheet.dimensions
                  table_name = "ModelCatalog" if name == "Modellek" else "WeldPointCatalog"
                  table = Table(displayName=table_name, ref=table_ref)
                  table.tableStyleInfo = TableStyleInfo(
                      name="TableStyleMedium2", showFirstColumn=False,
                      showLastColumn=False, showRowStripes=True, showColumnStripes=False
                  )
                  sheet.add_table(table)

          required = {"Modellek", "Hegesztési pontok"}
          if found != required:
              raise SystemExit(f"Hiányzó munkalapok: {required - found}")
          if wb["Modellek"].max_row != 11:
              raise SystemExit(f"10 járműkonfiguráció helyett ennyi sor van: {wb['Modellek'].max_row - 1}")
          wb.save(target)
          print(f"Elkészült: {target} | modellek: {wb['Modellek'].max_row - 1} | pontsorok: {wb['Hegesztési pontok'].max_row - 1}")
          PY
      - name: Commit generated XLSX to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/welding_catalog.xlsx
          if git diff --cached --quiet; then
            echo "Az XLSX nem változott; nincs új commit."
          else
            git commit -m "Generate XLSX reference catalog from Excel source"
            git push origin HEAD:develop
          fi
