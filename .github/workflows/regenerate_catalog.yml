name: Regenerate welding catalogue

on:
  push:
    branches: [develop]
    paths:
      - "tools/generate_catalog.py"
      - ".github/workflows/regenerate_catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install openpyxl
      - name: Generate XLSX
        run: python tools/generate_catalog.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/welding_catalog.xlsx
          if git diff --cached --quiet; then
            echo "Catalogue has no changes."
          else
            git commit -m "Regenerate 100-150 point welding catalogue"
            git push origin HEAD:develop
          fi
